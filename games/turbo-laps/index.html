<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Turbo Laps</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#173a1f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.6)}
  #hud div{background:rgba(0,0,0,.45);padding:6px 12px;border-radius:10px;font-size:15px;min-width:64px;text-align:center}
  #hud small{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;opacity:.75}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(8,20,12,.72);padding:20px}
  #msg.hide{display:none}
  #msg h1{margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:.06em;font-style:italic;color:#ffd23f;text-shadow:0 4px 0 #b35c00}
  #msg p{margin:0;opacity:.9;max-width:34ch;line-height:1.4}
  #msg button{margin-top:8px;font:800 18px system-ui,sans-serif;letter-spacing:.1em;padding:13px 34px;border:0;border-radius:12px;background:#ffd23f;color:#3a2600;box-shadow:0 5px 0 #b35c00;cursor:pointer}
  #msg button:active{transform:translateY(3px);box-shadow:0 2px 0 #b35c00}
  #count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font:900 clamp(80px,22vw,200px)/1 system-ui,sans-serif;font-style:italic;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35);pointer-events:none}
  #pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:0 14px calc(16px + env(safe-area-inset-bottom));pointer-events:none}
  body.touch #pad{display:flex}
  body.touch #hud div{padding:3px 9px;font-size:13px;min-width:54px}
  body.touch #hud small{font-size:9px}
  #pad .grp{display:flex;gap:12px;pointer-events:auto}
  .btn{width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:rgba(0,0,0,.4);color:#fff;font:800 13px system-ui,sans-serif;display:grid;place-items:center;touch-action:none}
  .btn.big{width:92px;height:92px;background:rgba(40,170,70,.55);font-size:15px}
  .btn.on{background:rgba(255,210,63,.7);color:#222}
  #keys{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.7;pointer-events:none;white-space:nowrap}
  body.touch #keys{display:none}
  @media (orientation:portrait){body.touch #turn{display:flex}}
  #turn{display:none;position:fixed;inset:0;z-index:5;background:#0b1d11;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-weight:800;letter-spacing:.1em;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><small>LAP</small><span id="hLap">1/3</span></div>
  <div><small>POSITION</small><span id="hPos">1/3</span></div>
  <div><small>TIME</small><span id="hTime">0.00</span></div>
  <div><small>BEST LAP</small><span id="hBest">--</span></div>
</div>
<div id="count"></div>
<div id="msg">
  <h1>TURBO LAPS</h1>
  <p id="sub">Beat two rivals over 3 laps. Stay on the tarmac: grass slows you down.</p>
  <button id="go">START RACE</button>
  <p id="how" style="font-size:13px;opacity:.7">Arrow keys / WASD to drive</p>
</div>
<div id="pad">
  <div class="grp"><div class="btn" id="bL">&#9664;</div><div class="btn" id="bR">&#9654;</div></div>
  <div class="grp"><div class="btn" id="bB">BRAKE</div><div class="btn big" id="bG">GAS</div></div>
</div>
<div id="keys">&uarr; gas &nbsp; &darr; brake &nbsp; &larr; &rarr; steer &nbsp; R restart</div>
<div id="turn"><div style="font-size:44px">&#8635;</div>ROTATE YOUR PHONE</div>
<script>
(function () {
  'use strict';
  var LAPS = 3, W = 1000, H = 600;
  // Track: ring between two ellipses, centred on (0,0). Center line is a=365, b=180.
  var OUT = { a: 460, b: 270 }, IN = { a: 270, b: 90 }, MID = { a: 365, b: 180 };
  var MAX = 260, ACC = 230, BRAKE = 420, DRAG = 90, GRASS_MAX = 95;

  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
  if (IS_TOUCH) { document.body.classList.add('touch'); $('how').textContent = 'Hold GAS, steer with the arrows'; }

  var scale = 1, ox = 0, oy = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = innerWidth, h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    scale = Math.min(w / (W + 40), h / (H + 40)) * dpr;
    ox = canvas.width / 2; oy = canvas.height / 2;
  }
  addEventListener('resize', resize); resize();

  // ---- input
  var keys = {}, pad = { l: false, r: false, g: false, b: false };
  addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (e.code === 'KeyR' && state !== 'menu') start();
    if ((e.code === 'Enter' || e.code === 'Space') && (state === 'menu' || state === 'done')) start();
    if (/^(Arrow|Space)/.test(e.code)) e.preventDefault();
  });
  addEventListener('keyup', function (e) { keys[e.code] = false; });
  function hold(id, k) {
    var el = $(id);
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); el.setPointerCapture(e.pointerId); pad[k] = true; el.classList.add('on'); });
    ['pointerup', 'pointercancel'].forEach(function (t) { el.addEventListener(t, function () { pad[k] = false; el.classList.remove('on'); }); });
  }
  hold('bL', 'l'); hold('bR', 'r'); hold('bG', 'g'); hold('bB', 'b');
  var steerIn = function () { return ((keys.ArrowRight || keys.KeyD || pad.r) ? 1 : 0) - ((keys.ArrowLeft || keys.KeyA || pad.l) ? 1 : 0); };
  var gasIn = function () { return !!(keys.ArrowUp || keys.KeyW || pad.g); };
  var brakeIn = function () { return !!(keys.ArrowDown || keys.KeyS || pad.b); };

  // ---- audio (tiny beeps, optional)
  var actx = null;
  function beep(freq, dur) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.type = 'square'; g.gain.value = 0.05;
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---- best lap (saved if storage is available)
  var best = null;
  try { var b = parseFloat(localStorage.getItem('turbo-laps-best')); if (b > 0) best = b; } catch (e) {}
  function saveBest(t) { best = t; try { localStorage.setItem('turbo-laps-best', String(t)); } catch (e) {} }

  // ---- cars
  function mkCar(color, name) { return { x: 0, y: 0, h: 0, v: 0, color: color, name: name, prog: 0, ang: 0, lapStart: 0 }; }
  var player, rivals, state = 'menu', t0 = 0, raceTime = 0, countdown = 0, lastLapTimes = [], finishOrder = [];

  function place(car, theta, lane) {
    var a = MID.a + lane, b = MID.b + lane * 0.6;
    car.x = a * Math.cos(theta); car.y = b * Math.sin(theta);
    car.h = Math.atan2(b * Math.cos(theta), -a * Math.sin(theta));
  }
  function thetaOf(x, y) { return Math.atan2(y / MID.b, x / MID.a); }

  function start() {
    player = mkCar('#e63946', 'You');
    rivals = [mkCar('#4361ee', 'Blue'), mkCar('#ffd23f', 'Gold')];
    rivals[0].lap = 7.6; rivals[1].lap = 8.4; rivals[0].lane = -45; rivals[1].lane = 45;
    place(player, -0.1, 0); player.ang = thetaOf(player.x, player.y);
    place(rivals[0], -0.17, -45); place(rivals[1], -0.17, 45);
    rivals[0].th = -0.17; rivals[1].th = -0.17;
    rivals.forEach(function (r) { r.prog = -0.17 / (2 * Math.PI); });
    player.prog = -0.1 / (2 * Math.PI);
    lastLapTimes = []; finishOrder = []; raceTime = 0;
    $('msg').classList.add('hide');
    state = 'count'; countdown = 3.99; lastCount = 4;
    $('hBest').textContent = best ? best.toFixed(2) : '--';
  }
  var lastCount = 0;

  function onTrack(x, y) {
    var o = (x * x) / (OUT.a * OUT.a) + (y * y) / (OUT.b * OUT.b);
    var i = (x * x) / (IN.a * IN.a) + (y * y) / (IN.b * IN.b);
    return o <= 1 && i >= 1;
  }

  function stepPlayer(dt) {
    var c = player, steer = steerIn(), gas = gasIn(), brk = brakeIn();
    var off = !onTrack(c.x, c.y), cap = off ? GRASS_MAX : MAX;
    if (gas) c.v += ACC * dt;
    else if (c.v > 0) c.v = Math.max(0, c.v - DRAG * dt);
    else if (c.v < 0) c.v = Math.min(0, c.v + DRAG * dt);
    if (brk) c.v -= BRAKE * dt;
    if (off && c.v > cap) c.v = Math.max(cap, c.v - 600 * dt);
    c.v = Math.max(-90, Math.min(MAX, c.v));
    c.h += steer * 2.5 * Math.min(1, Math.abs(c.v) / 110) * (c.v >= 0 ? 1 : -1) * dt;
    c.x += Math.cos(c.h) * c.v * dt; c.y += Math.sin(c.h) * c.v * dt;
    // soft wall at the outer fence
    var o = (c.x * c.x) / ((OUT.a + 30) * (OUT.a + 30)) + (c.y * c.y) / ((OUT.b + 30) * (OUT.b + 30));
    if (o > 1) { var k = 1 / Math.sqrt(o); c.x *= k; c.y *= k; c.v *= 0.6; }
    var th = thetaOf(c.x, c.y), d = th - c.ang;
    if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
    c.ang = th; c.prog += d / (2 * Math.PI);
  }

  function stepRival(r, dt) {
    r.th += (2 * Math.PI / r.lap) * dt * (1 + 0.03 * Math.sin(raceTime * 0.7 + r.lane));
    place(r, r.th, r.lane); r.v = 200; r.prog = r.th / (2 * Math.PI);
  }

  function standings() {
    var all = [player].concat(rivals);
    return all.slice().sort(function (a, b) { return b.prog - a.prog; });
  }

  function update(dt) {
    if (state === 'count') {
      countdown -= dt;
      var n = Math.ceil(countdown);
      if (n !== lastCount && n >= 0) { lastCount = n; beep(n > 0 ? 440 : 880, n > 0 ? 0.12 : 0.35); }
      var el = $('count'); el.style.display = 'flex'; el.textContent = n > 0 ? n : 'GO!';
      if (countdown <= -0.5) { el.style.display = 'none'; state = 'race'; }
      else if (countdown <= 0) { state = 'race'; setTimeout(function () { $('count').style.display = 'none'; }, 600); }
      return;
    }
    if (state !== 'race' && state !== 'done') return;
    if (state === 'race') {
      raceTime += dt;
      stepPlayer(dt);
      var lapsDone = Math.floor(player.prog);
      if (lapsDone > lastLapTimes.length && lapsDone >= 1) {
        var lt = raceTime - (lastLapTimes.reduce(function (s, x) { return s + x; }, 0));
        lastLapTimes.push(lt);
        if (!best || lt < best) { saveBest(lt); $('hBest').textContent = lt.toFixed(2); }
        beep(660, 0.15);
        if (lapsDone >= LAPS) finish();
      }
    } else { player.v *= 0.98; player.x += Math.cos(player.h) * player.v * dt; player.y += Math.sin(player.h) * player.v * dt; }
    rivals.forEach(function (r) { stepRival(r, dt); });
  }

  function finish() {
    state = 'done';
    var pos = standings().indexOf(player) + 1;
    var lines = ['Total ' + raceTime.toFixed(2) + 's', 'Best lap ' + Math.min.apply(null, lastLapTimes).toFixed(2) + 's'];
    $('msg').querySelector('h1').textContent = pos === 1 ? 'YOU WIN!' : 'FINISHED ' + pos + (pos === 2 ? 'ND' : 'RD');
    $('sub').textContent = lines.join('  •  ');
    $('go').textContent = 'RACE AGAIN';
    $('msg').classList.remove('hide');
  }

  // ---- drawing
  function ell(a, b) { ctx.beginPath(); ctx.ellipse(0, 0, a, b, 0, 0, Math.PI * 2); }
  function drawCar(c) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.h);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(-15, -8, 32, 20);
    ctx.fillStyle = c.color; ctx.fillRect(-16, -9, 32, 18);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(2, -6, 8, 12);
    ctx.fillStyle = '#111'; ctx.fillRect(-17, -11, 8, 4); ctx.fillRect(-17, 7, 8, 4); ctx.fillRect(8, -11, 8, 4); ctx.fillRect(8, 7, 8, 4);
    ctx.restore();
  }
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#2f7d3a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, ox, oy);
    // grass stripes
    ctx.fillStyle = 'rgba(255,255,255,.04)';
    for (var i = -8; i < 8; i += 2) ctx.fillRect(i * 70, -400, 70, 800);
    // tarmac
    ctx.fillStyle = '#3b3f46'; ell(OUT.a, OUT.b); ctx.fill();
    ctx.fillStyle = '#2f7d3a'; ell(IN.a, IN.b); ctx.fill();
    // kerbs
    [[OUT.a, OUT.b], [IN.a, IN.b]].forEach(function (e) {
      ctx.lineWidth = 8; ctx.strokeStyle = '#f4f4f4'; ell(e[0], e[1]); ctx.stroke();
      ctx.strokeStyle = '#d62828'; ctx.setLineDash([22, 22]); ell(e[0], e[1]); ctx.stroke(); ctx.setLineDash([]);
    });
    // centre dashes
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.setLineDash([16, 18]); ell(MID.a, MID.b); ctx.stroke(); ctx.setLineDash([]);
    // start/finish line
    ctx.save(); ctx.translate(MID.a, 0);
    for (var k = 0; k < 8; k++) { ctx.fillStyle = k % 2 ? '#fff' : '#111'; ctx.fillRect(-9 + (k % 2) * 9, -90 + k * 22.5 - 0, 9, 22.5); }
    ctx.restore();
    if (state === 'menu') return;
    rivals.forEach(drawCar); drawCar(player);
  }

  // ---- HUD + loop
  function ordinal(n) { return n + '/3'; }
  function hud() {
    if (state === 'menu') return;
    var lap = Math.min(LAPS, Math.max(1, Math.floor(player.prog) + 1));
    $('hLap').textContent = lap + '/' + LAPS;
    $('hPos').textContent = ordinal(standings().indexOf(player) + 1);
    $('hTime').textContent = raceTime.toFixed(2);
  }
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); hud();
    requestAnimationFrame(loop);
  }
  place({}, 0, 0);
  player = mkCar('#e63946', 'You'); rivals = [];
  $('go').addEventListener('click', start);
  window.__turbo = { get state() { return state; }, get player() { return player; }, get rivals() { return rivals; }, onTrack: onTrack };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
