name: Validate games
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every game
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Check the README generator runs
        run: npm run docs
      - name: Build the site
        run: npm run build
