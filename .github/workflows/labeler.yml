name: Label pull requests
# pull_request_target so fork PRs can be labelled. Nothing from the PR is checked out or run:
# the labeler only reads the list of changed files and the config from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
